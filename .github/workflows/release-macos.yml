name: Release (macOS)

# Builds Metrobits.app and its installer, Metrobits-<version>.pkg, on a Mac,
# through the same packaging/macos/package.sh used locally.
# Every run keeps the .pkg and its SHA-256 as the run's artifact; a tag
# v<version>, or v<version>-<suffix> for a release candidate, also puts them on
# a draft GitHub Release of that tag, to be published by hand. On tags and
# by hand only: macOS minutes cost several times Linux's on a private repo.
# Where the repo has the Developer ID secrets, the app and the
# .pkg are signed with them and notarized by Apple: MACOS_APP_CERT_P12 and
# MACOS_INSTALLER_CERT_P12 (base64 .p12 files), MACOS_CERT_PASSWORD, and
# NOTARY_API_KEY_P8 (a base64 App Store Connect API key), NOTARY_API_KEY_ID and
# NOTARY_API_ISSUER_ID. Without them, both are ad-hoc signed. If Apple
# takes longer than package.sh waits (NOTARY_WAIT, 20 minutes), the signed
# .pkg and its submission id stay in the run's artifact, the run warns, and
# packaging/macos/finish-notarization.sh finishes it on a Mac.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    # A tag builds a release only in the public repo, where packaging/snapshot.sh
    # puts each release; by hand, it builds anywhere.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'alexherrero/metrobits'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
      SIGNED: ${{ secrets.MACOS_APP_CERT_P12 != '' && secrets.NOTARY_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read the pinned versions
        run: |
          echo "GODOT_VERSION=$(cat .godot-version)" >> "$GITHUB_ENV"
          echo "GODOT_CPP_SHA=$(git rev-parse HEAD:extension/godot-cpp)" >> "$GITHUB_ENV"
          version=$(sed -n 's/^application\/short_version="\(.*\)"$/\1/p' game/export_presets.cfg)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            "v$VERSION" | "v$VERSION"-*) echo "tag $tag, version $VERSION" ;;
            *) echo "tag $tag doesn't match the export preset's version $VERSION" >&2; exit 1 ;;
          esac

      # The editor and the macOS export template; the full templates file is
      # 1.2 GB, so only the template is kept.
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-macos-universal-template

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          tpz="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/godot/templates && cd ~/godot
          curl -fsSLO "$base/$zip"
          curl -fsSLO "$base/$tpz"
          curl -fsSLO "$base/SHA512-SUMS.txt"
          grep -E " ($zip|$tpz)\$" SHA512-SUMS.txt | shasum -a 512 -c -
          unzip -q "$zip"
          unzip -q -j "$tpz" templates/macos.zip templates/version.txt -d templates
          rm "$zip" "$tpz" SHA512-SUMS.txt

      - name: Put Godot and its template in place
        run: |
          echo "GODOT=$HOME/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          templates="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          cp ~/godot/templates/* "$templates/"

      - name: Install SCons
        run: pipx install scons==4.11.1

      # godot-cpp is the slow part of the build and changes only with the
      # submodule, so its objects are cached per submodule commit.
      - name: Cache godot-cpp objects
        uses: actions/cache@v6
        with:
          path: .scons-cache
          key: scons-macos-universal-release-${{ env.GODOT_CPP_SHA }}

      # A keychain of its own for the run, holding the two Developer ID
      # identities and Apple's Developer ID intermediate, which completes their
      # chain; and the notary key as a file. The last step removes both.
      - name: Put the Developer ID in a keychain
        if: env.SIGNED == 'true'
        env:
          APP_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          for p12 in app installer; do
            security import "$RUNNER_TEMP/$p12.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          done
          rm "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identities=$(security find-identity -v "$keychain")
          app=$(echo "$identities" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          installer=$(echo "$identities" | grep -o '"Developer ID Installer: [^"]*"' | head -1 | tr -d '"')
          [[ -n "$app" && -n "$installer" ]] || { echo "the keychain lacks a valid Developer ID identity" >&2; echo "$identities" >&2; exit 1; }
          echo "signing as: $app; $installer"
          echo "$NOTARY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "MACOS_SIGN_APP=$app"
            echo "MACOS_SIGN_INSTALLER=$installer"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$KEY_ID"
            echo "NOTARY_ISSUER=$ISSUER"
            echo "SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Package
        run: bash packaging/macos/package.sh

      - name: Remove the keychain and the notary key
        if: always() && env.SIGNED == 'true'
        run: |
          [[ -z "${SIGNING_KEYCHAIN:-}" ]] || security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: Metrobits-${{ env.VERSION }}-macos
          path: |
            build/macos/Metrobits-${{ env.VERSION }}.pkg
            build/macos/Metrobits-${{ env.VERSION }}.pkg.sha256
            build/macos/Metrobits-${{ env.VERSION }}.pkg.notary-id
          retention-days: 30

      - name: Put it on a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ -f "build/macos/Metrobits-$VERSION.pkg.notary-id" ]]; then
            echo "::warning::Apple hadn't finished notarizing ($(cat "build/macos/Metrobits-$VERSION.pkg.notary-id")); run packaging/macos/finish-notarization.sh $tag on a Mac to staple it and put it on the release."
            exit 0
          fi
          prerelease=""
          [[ "$tag" == "v$VERSION" ]] || prerelease="--prerelease"
          notes="Metrobits ${tag#v} for macOS (Apple Silicon and Intel): open the .pkg to install it into Applications."
          if [[ "$SIGNED" == true ]]; then
            notes="$notes It's signed with a Developer ID and notarized by Apple."
          else
            notes="$notes This build isn't signed with a Developer ID, so macOS will warn that it can't check the developer; open it from System Settings, Privacy & Security, Open Anyway."
          fi
          # A version's own notes, packaging/release-notes/<version>.md, if it has them.
          notes_file="packaging/release-notes/${tag#v}.md"
          [[ -f "$notes_file" ]] || { echo "$notes" > "$RUNNER_TEMP/notes.md"; notes_file="$RUNNER_TEMP/notes.md"; }
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft $prerelease --verify-tag \
              --title "Metrobits ${tag#v}" --notes-file "$notes_file"
          fi
          gh release upload "$tag" --clobber \
            "build/macos/Metrobits-$VERSION.pkg" "build/macos/Metrobits-$VERSION.pkg.sha256"
